[package]
name = "rc_tui"
description = "The Slint frontend inside a terminal, through ratatui-slint: a proof of concept"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rocketchat_tui"
path = "src/main.rs"

[dependencies]
crossterm.workspace = true
ratatui.workspace = true
ratatui-slint.workspace = true
rc_slint.workspace = true
rc_view.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# `--dev` fills the login page in, as in rocketchat_slint.
developer-mode = ["rc_slint/developer-mode", "rc_view/developer-mode"]

[lints]
workspace = true
