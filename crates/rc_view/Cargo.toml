[package]
name = "rc_view"
description = "What the screens show for each account, without any GUI toolkit"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jiff.workspace = true
rc_core.workspace = true
tracing.workspace = true

[features]
# Set through rc_qt's feature of the same name: `--dev` fills the login page in (dev_login).
developer-mode = []
# Set through rc_qt's feature of the same name: RC_SECRET_STORE=file:<path> keeps the token in a plain file.
test-file-store = ["rc_core/test-file-store"]

[dev-dependencies]
rc_api.workspace = true

[lints]
workspace = true
