[package]
name = "rc_core"
description = "GUI-agnostic application core"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
keyring-core.workspace = true
rc_api.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

# Where each OS keeps secrets. Linux links the system libdbus, so building needs its development
# package and pkg-config.
[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store.workspace = true

[lints]
workspace = true
