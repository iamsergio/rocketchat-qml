[package]
name = "rc_slint"
description = "The Slint frontend, a pure Rust app on rc_core"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rocketchat_slint"
path = "src/main.rs"

[dependencies]
# Optional, behind `spix`: the search API of Slint's testing backend, which the Spix server needs
# and which must match Slint's version exactly. Its software renderer gives the windows pixels, for
# the Spix call `takeScreenshot`.
i-slint-backend-testing = { workspace = true, features = ["renderer-software"], optional = true }
jiff.workspace = true
open.workspace = true
rc_core.workspace = true
rc_view.workspace = true
rfd.workspace = true
secrecy.workspace = true
slint.workspace = true
# Optional, behind `spix`: the Spix test server that speaks to the GUI test suite.
spix_slint = { path = "../../3rdparty/spix/rust/spix_slint", optional = true }
thiserror.workspace = true
tracing.workspace = true

[features]
# Slint's Skia renderer, for the performance runs (`RC_SLINT_RENDERER=skia-opengl` and
# `skia-vulkan`). It downloads a prebuilt Skia and makes the binary much bigger, so only the
# `perf-slint` preset turns it on.
skia = ["slint/renderer-skia"]
# Also log to a file next to the executable, and `--dev` fills the login page in.
developer-mode = ["rc_view/developer-mode"]
# `--spix-port` starts the Spix test server, on Slint's testing backend: headless, so the GUI tests
# need no display. `test-file-store` keeps the session token in a plain file, for the GUI tests that
# restart the app, and `test-attach-files` lets them choose the files to attach, as rc_qt's features of
# the same names do.
spix = [
    "dep:spix_slint",
    "dep:i-slint-backend-testing",
    "rc_view/test-file-store",
    "rc_view/test-attach-files",
]

[dev-dependencies]
i-slint-backend-testing.workspace = true
rc_api.workspace = true

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true
