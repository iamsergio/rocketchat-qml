[package]
name = "rc_slint"
description = "The Slint frontend, a pure Rust app on rc_core"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rocketchat_slint"
path = "src/main.rs"

[dependencies]
rc_core.workspace = true
slint.workspace = true

[features]
# Also log to a file next to the executable.
developer-mode = []

[dev-dependencies]
i-slint-backend-testing.workspace = true

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true
