# Crate names use underscores, not hyphens: cxx-qt-cmake looks crates up by their CMake target
# name, so a hyphenated crate never exports its generated files.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# No version: version.txt is the only source (see rc_core::VERSION).
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
cxx = "1.0.176"
cxx-qt = "0.10.0"
cxx-qt-build = "0.10.0"
cxx-qt-lib = "0.10.0"
# Linux Secret Service through the system libdbus (pkg-config), which Qt loads as well: never
# "vendored", or two libdbus copies would end up in one process. crypto-rust avoids OpenSSL.
# Not the `keyring` crate: its features always pull in the zbus store, whose crates are flagged
# unmaintained.
dbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = ["crypto-rust"] }
emojis = "0.9.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
jiff = "0.2.38"
keyring-core = "1.0.0"
rc_api = { path = "crates/rc_api" }
rc_core = { path = "crates/rc_core" }
rc_test_server = { path = "crates/rc_test_server" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "system-proxy"] }
roxmltree = "0.21.1"
# The crypto provider reqwest's rustls uses, so there is only one.
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std"] }
rustls-platform-verifier = "0.7.1"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = "1.53.2"
# TLS through the rustls config rc_api builds, with the same verifier as reqwest.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "__rustls-tls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }
# Plain HTTP only: no TLS, no compression.
ureq = { version = "3.4.2", default-features = false }
windows-native-keyring-store = "1.1.0"
wiremock = "0.6.5"

[workspace.lints.rust]
# Crates that need unsafe (only rc_qt) allow it at the crate root.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
