# Crate names use underscores, not hyphens: cxx-qt-cmake looks crates up by their CMake target
# name, so a hyphenated crate never exports its generated files.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# No version: version.txt is the only source (see rc_core::VERSION).
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
crossterm = "0.29.0"
cxx = "1.0.176"
cxx-qt = "0.10.0"
cxx-qt-build = "0.10.0"
cxx-qt-lib = "0.10.0"
# Linux Secret Service through the system libdbus (pkg-config), which Qt loads as well: never
# "vendored", or two libdbus copies would end up in one process. crypto-rust avoids OpenSSL.
# Not the `keyring` crate: its features always pull in the zbus store, whose crates are flagged
# unmaintained.
dbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = ["crypto-rust"] }
emojis = "0.9.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# The testing backend (the search API for UI tests) is internal to Slint: its version must match
# slint's exactly.
i-slint-backend-testing = "=1.18.1"
jiff = "0.2.38"
keyring-core = "1.0.0"
linkify = "0.10.0"
# Opens a link in the default browser.
open = "5.4.5"
# Collapses `perf script` output and draws flame graphs, in the dev tool rc_gui_perf. CDDL-1.0, see
# deny.toml.
inferno = { version = "0.12.8", default-features = false }
# Reads the screenshots of the GUI tests.
png = "0.18.1"
# Markdown for the topic of a room, parsed to events: no HTML renderer.
pulldown-cmark = { version = "0.13.4", default-features = false }
# Runs the Slint frontend in a terminal (`rc_tui`).
ratatui = "0.30.0"
ratatui-slint = "0.1.0"
rc_api = { path = "crates/rc_api" }
rc_core = { path = "crates/rc_core" }
rc_github = { path = "crates/rc_github" }
rc_slint = { path = "crates/rc_slint" }
rc_test_server = { path = "crates/rc_test_server" }
rc_view = { path = "crates/rc_view" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls", "stream", "system-proxy"] }
# The Slint app's file dialog (Slint has none). On Linux only the xdg-portal backend, which talks to
# the desktop's portal through libdbus loaded at run time: no GTK, no zbus, no Wayland crates.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
roxmltree = "0.21.1"
# The crypto provider reqwest's rustls uses, so there is only one.
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std"] }
rustls-platform-verifier = "0.7.1"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order: a message pushed over DDP goes through `Value` first, and its reactions must keep
# the order the server lists them in.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# A pure Rust build: no `backend-qt` (it builds a Qt backend when qmake is found). No
# `accessibility` yet: see "rc_slint has no screen-reader support" in PLAN.md. `unstable-winit-030`
# hands the app winit's events, for the files dropped on the window (it adds no crate: winit is
# Slint's own).
slint = { version = "1.18.1", default-features = false, features = ["backend-winit", "compat-1-2", "renderer-femtovg", "renderer-software", "std", "unstable-winit-030"] }
slint-build = "1.18.1"
thiserror = "2.0.21"
tokio = "1.53.2"
# TLS through the rustls config rc_api builds, with the same verifier as reqwest.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "__rustls-tls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }
# The synchronous side of tokio-tungstenite, for the plain-HTTP connection of the test support.
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
# Takes the accents off a name, for the search of the room list.
unicode-normalization = { version = "0.1.25", default-features = false, features = ["std"] }
# Plain HTTP only: no TLS, no compression.
ureq = { version = "3.4.2", default-features = false }
windows-native-keyring-store = "1.1.0"
wiremock = "0.6.5"

[workspace.lints.rust]
# Crates that need unsafe (only rc_qt) allow it at the crate root.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
