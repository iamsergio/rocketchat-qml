version = 1
SPDX-PackageName = "RocketChatQml"
SPDX-PackageDownloadLocation = "https://www.github.com/iamsergio/rocketchat-qml"

[[annotations]]
path = [
    "README.md",
    "CMakePresets.json",
    ".gitignore",
    "code.code-workspace",
    ".clang-format",
    ".clangd",
    ".clang-tidy",
    ".cmake-format.yaml",
    ".github/dependabot.yml",
    ".qmllint.ini",
    "version.txt",
    ".gitmodules",
    "ARCHITECTURE.md",
    "PLAN.md",
    "TRACEABILITY.md",
    "CXX-QT.md",
    "SLINT.md",
    "CLAUDE.md",
    ".claude/agents/*.md",
    ".claude/skills/**/SKILL.md",
    "docs/design/*.md",
    "Cargo.lock",
    "vcpkg.json",
    ".mcp.json"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sergio Martins"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "crates/rc_api/tests/fixtures/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sergio Martins"
SPDX-License-Identifier = "MIT"

# Generated by scripts/update_emojione.py from the emojione npm package (non-artwork files, MIT).
[[annotations]]
path = "crates/rc_core/data/emojione.tsv"
precedence = "aggregate"
SPDX-FileCopyrightText = "2016 EmojiOne (https://www.emojione.com)"
SPDX-License-Identifier = "MIT"

# The UI font, bundled with the app (https://github.com/Instrument/instrument-sans).
[[annotations]]
path = "src/gui/fonts/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2022 The Instrument Sans Project Authors"
SPDX-License-Identifier = "OFL-1.1"
