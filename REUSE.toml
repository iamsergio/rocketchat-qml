version = 1
SPDX-PackageName = "RocketChatQml"
SPDX-PackageDownloadLocation = "https://www.github.com/iamsergio/rocketchat-qml"

[[annotations]]
path = [
    "README.md",
    "CMakePresets.json",
    ".gitignore",
    "code.code-workspace",
    ".clang-format",
    ".clangd",
    ".clang-tidy",
    ".cmake-format.yaml",
    ".github/dependabot.yml",
    ".qmllint.ini",
    "version.txt",
    ".gitmodules",
    "ARCHITECTURE.md",
    "PLAN.md",
    "TRACEABILITY.md",
    "CXX-QT.md",
    "CLAUDE.md",
    "Cargo.lock",
    "vcpkg.json",
    ".mcp.json"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sergio Martins"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "crates/rc_api/tests/fixtures/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sergio Martins"
SPDX-License-Identifier = "MIT"
