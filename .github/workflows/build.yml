name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.preset }} ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        preset: [dev]
        os: [ubuntu-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # Not recursive: Spix's own vcpkg copy isn't needed. QtCommander is skipped (update = none).
    - name: Checkout submodules
      run: git submodule update --init

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.12.0'
        cache: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0

    # After installing Qt: rc_qt's build script needs qmake.
    - name: Check Rust formatting
      run: cargo fmt --all --check

    - name: Run clippy
      run: cargo clippy --workspace --all-targets --locked -- -D warnings

    - name: Run Rust tests
      run: cargo test --workspace --locked

    - name: Configure CMake
      run: cmake --preset=${{ matrix.preset }}

    - name: Build
      run: cmake --build build-${{ matrix.preset }}

    - name: Run qmllint
      run: ninja -C ./build-${{ matrix.preset }} all_qmllint
